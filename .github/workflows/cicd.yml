name: AjaxAI Azure CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      location:
        description: Azure region for the deployment
        required: false
        default: uaenorth

env:
  AZURE_LOCATION: uaenorth
  AZURE_RESOURCE_GROUP: ajaxai-rg7
  AZURE_LOG_ANALYTICS_WORKSPACE: law-ajaxai-prod
>>>>>>> b21496f97982d5b07f8b6ab8f2ee053d6cea7e46
  AZURE_CONTAINERAPPS_ENV: cae-ajaxai-prod
  AZURE_FRONTEND_APP: ajaxai-frontend
  AZURE_BACKEND_APP: ajaxai-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade

      - name: Prepare Azure resources
        shell: bash
        run: |
          set -euo pipefail

          acr_suffix=$(printf '%s' "$AZURE_RESOURCE_GROUP" | sha1sum | cut -c1-8)

          az group create --name "$AZURE_RESOURCE_GROUP" --location "$AZURE_LOCATION" >/dev/null

          # Note: if you do not have infra/main.bicep, you must ensure your Azure environment is manually created 
          # or we just use AZ CLI to create the ACR and ACA environments here.
          # Since infra was not fully specified, we will assume the simplest ACR creation:
          
          acr_name="craajaxai${acr_suffix}"
          echo "ACR_NAME=$acr_name" >> "$GITHUB_ENV"
          
          # Create ACR if it doesn't exist
          if ! az acr show --name "$acr_name" --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az acr create --name "$acr_name" --resource-group "$AZURE_RESOURCE_GROUP" --sku Basic --admin-enabled true >/dev/null
          fi
          
          acr_login_server=$(az acr show --name "$acr_name" --resource-group "$AZURE_RESOURCE_GROUP" --query loginServer -o tsv)
          echo "ACR_LOGIN_SERVER=$acr_login_server" >> "$GITHUB_ENV"

          # Create Container Apps Environment if it doesn't exist
          if ! az containerapp env show --name "$AZURE_CONTAINERAPPS_ENV" --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp env create --name "$AZURE_CONTAINERAPPS_ENV" --resource-group "$AZURE_RESOURCE_GROUP" --location "$AZURE_LOCATION" >/dev/null
          fi

          az acr login --name "$acr_name"
          
          acr_username=$(az acr credential show --name "$acr_name" --query username -o tsv)
          acr_password=$(az acr credential show --name "$acr_name" --query "passwords[0].value" -o tsv)

          echo "ACR_USERNAME=$acr_username" >> "$GITHUB_ENV"
          echo "ACR_PASSWORD=$acr_password" >> "$GITHUB_ENV"

      - name: Build and push backend image
        shell: bash
        run: |
          set -euo pipefail
          docker build -f backend/Dockerfile -t "$ACR_LOGIN_SERVER/backend:${GITHUB_SHA}" ./backend
          docker push "$ACR_LOGIN_SERVER/backend:${GITHUB_SHA}"

      - name: Create or update backend container app
        shell: bash
        run: |
          set -euo pipefail

          backend_env_vars=(
            "PORT=8000"
          )

          if az containerapp show --name "$AZURE_BACKEND_APP" --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp update \
              --name "$AZURE_BACKEND_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$ACR_LOGIN_SERVER/backend:${GITHUB_SHA}" \
              --set-env-vars "${backend_env_vars[@]}" >/dev/null
          else
            az containerapp create \
              --name "$AZURE_BACKEND_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --environment "$AZURE_CONTAINERAPPS_ENV" \
              --image "$ACR_LOGIN_SERVER/backend:${GITHUB_SHA}" \
              --registry-server "$ACR_LOGIN_SERVER" \
              --registry-username "$ACR_USERNAME" \
              --registry-password "$ACR_PASSWORD" \
              --target-port 8000 \
              --ingress external \
              --min-replicas 1 \
              --max-replicas 2 \
              --set-env-vars "${backend_env_vars[@]}" >/dev/null
          fi

      - name: Resolve backend URL
        shell: bash
        run: |
          set -euo pipefail
          backend_fqdn=$(az containerapp show --name "$AZURE_BACKEND_APP" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "BACKEND_ORIGIN=https://$backend_fqdn" >> "$GITHUB_ENV"

      - name: Build and push frontend image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE="$BACKEND_ORIGIN" \
            -f apps/frontend/Dockerfile \
            -t "$ACR_LOGIN_SERVER/frontend:${GITHUB_SHA}" .
          docker push "$ACR_LOGIN_SERVER/frontend:${GITHUB_SHA}"

      - name: Create or update frontend container app
        shell: bash
        run: |
          set -euo pipefail

          if az containerapp show --name "$AZURE_FRONTEND_APP" --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp update \
              --name "$AZURE_FRONTEND_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$ACR_LOGIN_SERVER/frontend:${GITHUB_SHA}" >/dev/null
          else
            az containerapp create \
              --name "$AZURE_FRONTEND_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --environment "$AZURE_CONTAINERAPPS_ENV" \
              --image "$ACR_LOGIN_SERVER/frontend:${GITHUB_SHA}" \
              --registry-server "$ACR_LOGIN_SERVER" \
              --registry-username "$ACR_USERNAME" \
              --registry-password "$ACR_PASSWORD" \
              --target-port 3000 \
              --ingress external \
              --min-replicas 1 \
              --max-replicas 2 >/dev/null
          fi
