version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: ./services/backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
    volumes:
      - .:/app
    command: npm run dev:backend

  agent-runtime:
    build:
      context: .
      dockerfile: ./services/agent-runtime/Dockerfile
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
    depends_on:
      - backend
    command: npm run dev:agent

  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    volumes:
      - .:/app
    depends_on:
      - backend
    command: npm run dev:frontend
